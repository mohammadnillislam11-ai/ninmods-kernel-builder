name: Build and Release NINMODS Driver Loader

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Build Tools & Apktool 2.10.0
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign

          # Install official Apktool v2.10.0 with bundled AAPT2
          sudo curl -sL https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o /usr/local/bin/apktool
          sudo curl -sL https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -o /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar

      - name: Verify Apktool Installation
        run: |
          java -jar /usr/local/bin/apktool.jar --version

      - name: Recompile APK (Safe AAPT2 Build)
        run: |
          mkdir -p build
          java -jar /usr/local/bin/apktool.jar b --use-aapt2 decompiled_source -o build/ninmods_loader_unsigned.apk

      - name: Zipalign APK (4-byte page align)
        run: |
          zipalign -p -f 4 build/ninmods_loader_unsigned.apk build/ninmods_loader_aligned.apk

      - name: Sign APK (v1+v2+v3, no .idsig)
        run: |
          mkdir -p release_apk
          UBER_SIGNER_URL="https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar"
          if curl -sL --fail "$UBER_SIGNER_URL" -o uber-apk-signer.jar; then
            echo "Signing with uber-apk-signer (v1+v2+v3, no v4)..."
            java -jar uber-apk-signer.jar \
              --allowResign \
              -a build/ninmods_loader_aligned.apk \
              -o release_apk/
            OUTPUT_APK=$(find release_apk -type f -name "*.apk" | grep -v idsig | head -n 1)
            # Remove any .idsig files (prohibited by GEMINI.md)
            find release_apk -name "*.idsig" -delete
            # Publish as V90.57 (current) and legacy names for compatibility
            cp "$OUTPUT_APK" "release_apk/Loader_V90.57.apk"
            cp "$OUTPUT_APK" "release_apk/NINMODS_Driver_Loader.apk"
            cp "$OUTPUT_APK" "release_apk/Loader_V45.apk"
            # Remove intermediate signed file (keep only named versions)
            rm -f release_apk/*aligned-debugSigned.apk release_apk/*.idsig 2>/dev/null || true
          else
            echo "Signing with debug keystore (fallback)..."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore debug.keystore \
              -storepass android build/ninmods_loader_aligned.apk androiddebugkey
            cp build/ninmods_loader_aligned.apk "release_apk/Loader_V90.57.apk"
            cp build/ninmods_loader_aligned.apk "release_apk/NINMODS_Driver_Loader.apk"
            cp build/ninmods_loader_aligned.apk "release_apk/Loader_V45.apk"
          fi
          echo "=== Release APKs ==="
          ls -lh release_apk/

      - name: Fetch Latest Main App APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo mohammadnillislam11-ai/ninmods --pattern "Main_V*.apk" --dir release_apk/ 2>/dev/null || echo "Main App download fallback"
          ls -la release_apk/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Loader-V90.57-APK
          path: release_apk/*.apk

      - name: Create GitHub Release and Upload Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up all older releases..."
          for old_tag in $(gh release list --limit 50 --json tagName -q '.[].tagName'); do
            echo "Deleting old release: $old_tag"
            gh release delete "$old_tag" --yes --cleanup-tag || true
          done

          RELEASE_TAG="V90.57-$(date +'%Y%m%d%H%M%S')"
          ASSETS=$(find release_apk -type f -name "*.apk")
          gh release create "$RELEASE_TAG" \
            $ASSETS \
            --title "Loader V90.57 — Critical insmod fix" \
            --notes "## Loader V90.57 — Critical Kernel Module Loading Fix

**Fix:** Kernel modules (.ko files) were incorrectly executed via \`sh\` (which fails on ELF binaries). Now correctly:
1. Copies .ko to SELinux-safe \`/data/local/tmp/_nin_drv.ko\`
2. Sets permissions \`chmod 644\`
3. Loads via \`insmod /data/local/tmp/_nin_drv.ko\`

**Impact:** Driver loading should now succeed when vermagic matches — resolving the issue where all other loaders worked but ours failed.

Download: https://github.com/mohammadnillislam11-ai/ninmods/releases/latest" || echo "Release creation skipped"
