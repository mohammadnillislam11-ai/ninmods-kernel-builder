name: Build and Release NINMODS Driver Loader

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Build Tools & Apktool 2.10.0
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign

          # Install official Apktool v2.10.0 with bundled AAPT2
          sudo curl -sL https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o /usr/local/bin/apktool
          sudo curl -sL https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -o /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar

      - name: Verify Apktool Installation
        run: |
          java -jar /usr/local/bin/apktool.jar --version

      - name: Recompile APK (Safe AAPT2 Build)
        run: |
          mkdir -p build
          java -jar /usr/local/bin/apktool.jar b --use-aapt2 decompiled_source -o build/ninmods_loader_unsigned.apk

      - name: Zipalign APK (4-byte page align)
        run: |
          zipalign -p -f 4 build/ninmods_loader_unsigned.apk build/ninmods_loader_aligned.apk

      - name: Decode Release Keystore (required, no debug fallback)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is not configured. Refusing to publish a debug-signed release."
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > signing/release.keystore
          if [ ! -s signing/release.keystore ]; then
            echo "::error::Decoded keystore is empty - check RELEASE_KEYSTORE_BASE64."
            exit 1
          fi
          chmod 600 signing/release.keystore
          echo "Release keystore decoded OK ($(wc -c < signing/release.keystore) bytes)."

      - name: Sign APK (apksigner v1+v2+v3, v4 disabled, .idsig removed)
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # Fail closed: never fall back to a debug / throwaway key.
          for var in RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Required secret $var is not configured. Aborting (no debug-key fallback)."
              exit 1
            fi
          done
          if [ -z "${RELEASE_KEY_PASSWORD:-}" ]; then
            export RELEASE_KEY_PASSWORD="$RELEASE_KEYSTORE_PASSWORD"
          fi
          if [ ! -f signing/release.keystore ]; then
            echo "::error::signing/release.keystore missing - keystore decode step failed."
            exit 1
          fi

          mkdir -p release_apk
          # Extract dynamic version from apktool.yml
          LOADER_VER=$(grep 'versionName:' decompiled_source/apktool.yml | sed -E "s/.*versionName: '([^']+)'.*/\1/" | tr -d ' \r\n')
          if [ -z "$LOADER_VER" ]; then LOADER_VER="90.58"; fi
          echo "Loader Version: $LOADER_VER"

          APKSIGNER=$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$APKSIGNER" ]; then
            sudo apt-get update
            sudo apt-get install -y apksigner
            APKSIGNER=$(command -v apksigner)
          fi
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" --version

          OUT_APK="release_apk/Loader_V${LOADER_VER}.apk"
          rm -f "$OUT_APK"

          "$APKSIGNER" sign \
            --ks signing/release.keystore \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            -v \
            --out "$OUT_APK" \
            build/ninmods_loader_aligned.apk

          # v4 produces a .idsig sidecar file - prohibited by project rule 10.
          find . -name "*.idsig" -delete

          # Hard verification: v2 + v3 must actually be present.
          "$APKSIGNER" verify -v --print-certs "$OUT_APK" | tee verify.txt
          grep -qE "Verified using v2 scheme .*: true" verify.txt
          grep -qE "Verified using v3 scheme .*: true" verify.txt
          if grep -qi "CN=Android Debug" verify.txt; then
            echo "::error::Release APK is signed with a DEBUG certificate. Aborting."
            exit 1
          fi
          echo "=== Release APKs ==="
          ls -lh release_apk/

      - name: Fetch Latest Main App APK (Preserve Original Version)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch Main App from releases without renaming it (preserves its original build version)
          gh release download --repo mohammadnillislam11-ai/ninmods --pattern "Main_V*.apk" --dir release_apk/ 2>/dev/null || echo "Main App download fallback"
          ls -la release_apk/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Loader-APK
          path: release_apk/*.apk

      - name: Create GitHub Release and Upload Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOADER_VER=$(grep 'versionName:' decompiled_source/apktool.yml | sed -E "s/.*versionName: '([^']+)'.*/\1/" | tr -d ' \r\n')
          if [ -z "$LOADER_VER" ]; then LOADER_VER="90.58"; fi

          echo "Cleaning up all older releases..."
          for old_tag in $(gh release list --limit 50 --json tagName -q '.[].tagName'); do
            echo "Deleting old release: $old_tag"
            gh release delete "$old_tag" --yes --cleanup-tag || true
          done

          RELEASE_TAG="V${LOADER_VER}-$(date +'%Y%m%d%H%M%S')"
          ASSETS=$(find release_apk -type f -name "*.apk")
          NOTES="Loader V${LOADER_VER}: Official Kernel Driver Loader"
          gh release create "$RELEASE_TAG" \
            $ASSETS \
            --title "Loader V${LOADER_VER}" \
            --notes "$NOTES" || echo "Release creation skipped"
